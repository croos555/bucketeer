[package]
name = "bucketeer"
version = "0.2.0"
description = "Local-first browser for S3-compatible object storage"
authors = ["Christophe Roos"]
license = "MIT"
edition = "2021"

[lib]
name = "bucketeer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cbc = { version = "0.2.1", features = ["alloc"] }
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.152.0", features = ["behavior-version-latest"] }
aws-smithy-types = "1.9.0"
base64 = "0.22"
dirs = "6"
futures = "0.3.34"
getrandom = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
mime_guess = "2.0.5"
pbkdf2 = "0.12"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.0", features = ["full"] }
trash = "5"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-clipboard-manager = "2"
aws-smithy-http-client = { version = "1.5", features = ["rustls-aws-lc"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"

[target."cfg(windows)".dependencies]
winreg = "0.56"
