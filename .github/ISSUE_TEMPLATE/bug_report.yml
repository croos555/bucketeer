name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste access keys, secret keys, signed links or your vault.json.**
        Security issues: use [private vulnerability reporting](https://github.com/croos555/bucketeer/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead (with the error message if any).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: version
    attributes:
      label: Bucketeer version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Storage provider
      options: [OVHcloud, Amazon S3, Scaleway, Wasabi, Cloudflare R2, MinIO, Other S3-compatible]
    validations:
      required: true
