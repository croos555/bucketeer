name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the WebKitGTK build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libdbus-1-dev libxdo-dev >/dev/null

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      # The Rust crate embeds the built renderer (frontendDist), so build it first
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # The end-to-end S3 test is #[ignore]d: it needs a local SeaweedFS (see docs/development.md)
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm audit --omit=dev --audit-level=high
