name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --x64 --arm64
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      # macOS: sign with the Developer ID certificate and notarize on release tags when the secrets exist
      SIGN_MAC: ${{ matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CSC_LINK != '' && secrets.APPLE_API_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build

      # electron-builder needs rpmbuild for the .rpm package
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm >/dev/null

      # Own keychain, as in GitHub's docs for macOS runners: electron-builder's temporary keychain fails to
      # unlock on the hosted runners (set-key-partition-list: SecKeychainUnlock), so it uses this one instead
      - name: Import the Developer ID certificate
        if: env.SIGN_MAC == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$MAC_CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      # notarytool reads the App Store Connect API key from a file: write it for the duration of the job
      - name: Prepare notarization key
        if: env.SIGN_MAC == 'true'
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      - run: npx electron-builder ${{ matrix.args }} --publish never ${{ env.SIGN_MAC == 'true' && '-c.mac.notarize=true' || '' }}
        env:
          # Without the secrets (forks, manual runs, Linux) nothing is signed. With them, electron-builder
          # finds the Developer ID identity in the keychain imported above (CSC_KEYCHAIN).
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.SIGN_MAC == 'true' && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ env.SIGN_MAC == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.SIGN_MAC == 'true' && secrets.APPLE_API_ISSUER || '' }}

      - name: Verify macOS signatures and notarization
        if: env.SIGN_MAC == 'true'
        run: |
          for app in dist/mac*/Bucketeer.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee /tmp/spctl.txt
            grep -q "source=Notarized Developer ID" /tmp/spctl.txt
            xcrun stapler validate "$app"
          done

      - name: Remove the notarization key and the signing keychain
        if: always() && env.SIGN_MAC == 'true'
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: bucketeer-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # Windows packages are built and signed on Linux: Wine runs the NSIS uninstaller stub, ssign signs.
  # Runs on the host: ssign's Linux binary needs the glibc of Ubuntu 24.04.
  build-windows:
    runs-on: ubuntu-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Sign with the Certum cloud certificate on release tags when the secrets exist
      SIGN_WINDOWS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CERTUM_TOTP_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npx electron-vite build

      # electron-builder runs the 32-bit NSIS stub under Wine to produce the uninstaller
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          # 'wine' provides the wine command electron-builder calls; wine32 runs the 32-bit NSIS stub
          sudo apt-get install -y -qq --no-install-recommends wine wine64 wine32:i386 >/dev/null
          wine --version

      # ssign signs through Certum's cloud API over HTTPS. Pinned release, checksum verified.
      - name: Install ssign and osslsigncode
        if: env.SIGN_WINDOWS == 'true'
        run: |
          curl -fsSL -o /tmp/ssign.tar.gz https://github.com/Le-Syl21/ssign/releases/download/v0.1.8/ssign-linux-x86_64.tar.gz
          echo "fc38f083ea1f061a097a3a9c5dc1a056c9c7310a47e40f56a8976895ec5a928d  /tmp/ssign.tar.gz" | sha256sum -c -
          sudo tar xzf /tmp/ssign.tar.gz -C /usr/local/bin ssign
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode >/dev/null

      # build/sign-win.js signs every exe (app, installer, uninstaller, portable) when the Certum secrets are set
      - run: npx electron-builder --win --publish never
        env:
          CERTUM_EMAIL: ${{ env.SIGN_WINDOWS == 'true' && secrets.CERTUM_USERNAME || '' }}
          CERTUM_OTP: ${{ env.SIGN_WINDOWS == 'true' && secrets.CERTUM_TOTP_SECRET || '' }}

      - name: Verify Windows signatures
        if: env.SIGN_WINDOWS == 'true'
        run: |
          for f in dist/*.exe dist/win-unpacked/Bucketeer.exe; do
            echo "== $f"
            osslsigncode verify -in "$f" -CAfile /etc/ssl/certs/ca-certificates.crt | tee /tmp/verify.txt
            grep -q "Signature verification: ok" /tmp/verify.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bucketeer-Windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          # v1.2.3-rc.1 and similar are published as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
