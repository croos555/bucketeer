name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    env:
      # Sign with the Developer ID certificate and notarize on release tags when the secrets exist
      SIGN_MAC: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.MAC_CSC_LINK != '' && secrets.APPLE_API_KEY_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci
      - run: npm run typecheck

      # Own keychain, as in GitHub's docs for macOS runners; Tauri finds the identity through
      # APPLE_SIGNING_IDENTITY and codesign searches the keychain list
      - name: Import the Developer ID certificate
        if: env.SIGN_MAC == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$MAC_CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          test -n "$IDENTITY"
          echo "Signing as: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      # notarytool reads the App Store Connect API key from a file: write it for the duration of the job
      - name: Prepare notarization key
        if: env.SIGN_MAC == 'true'
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}

      # Without the secrets (forks, manual runs) the app is left unsigned. With them, Tauri signs with the
      # hardened runtime, notarizes with the API key (APPLE_API_KEY is the key ID) and staples the ticket.
      - run: npx tauri build --ci --target ${{ matrix.target }} --bundles app,dmg
        env:
          APPLE_API_KEY: ${{ env.SIGN_MAC == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ env.SIGN_MAC == 'true' && secrets.APPLE_API_ISSUER || '' }}

      - name: Verify macOS signature and notarization
        if: env.SIGN_MAC == 'true'
        run: |
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Bucketeer.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt
          xcrun stapler validate "$app"

      - name: Remove the notarization key and the signing keychain
        if: always() && env.SIGN_MAC == 'true'
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/developer-id.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v7
        with:
          name: bucketeer-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        # 22.04: the oldest glibc still supported by the runners, so the packages run on more distributions
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the WebKitGTK build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev libdbus-1-dev libxdo-dev patchelf file build-essential >/dev/null

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npx tauri build --ci --verbose --bundles appimage,deb,rpm

      - uses: actions/upload-artifact@v7
        with:
          name: bucketeer-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Sign with the Certum cloud certificate on release tags when the secrets exist
      SIGN_WINDOWS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CERTUM_TOTP_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci
      - run: npm run typecheck

      # ssign signs through Certum's cloud API over HTTPS. Pinned release, checksum verified.
      # Tauri calls build/sign-win.js for the app, the installer and the uninstaller.
      - name: Install ssign and configure the sign command
        if: env.SIGN_WINDOWS == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ssign.zip" https://github.com/Le-Syl21/ssign/releases/download/v0.1.8/ssign-windows-x86_64.zip
          echo "89cbac647d19819a1a82645d2254ac51d2b34050835421294584385dadde1298  $RUNNER_TEMP/ssign.zip" | sha256sum -c -
          7z x -y -o"$RUNNER_TEMP/ssign" "$RUNNER_TEMP/ssign.zip" >/dev/null
          echo "SSIGN_PATH=$(cygpath -w "$RUNNER_TEMP/ssign/ssign.exe")" >> "$GITHUB_ENV"
          SCRIPT="$(cygpath -m "$GITHUB_WORKSPACE/build/sign-win.js")"
          printf '{"bundle":{"windows":{"signCommand":{"cmd":"node","args":["%s","%%1"]}}}}' "$SCRIPT" > "$RUNNER_TEMP/sign.conf.json"
          cat "$RUNNER_TEMP/sign.conf.json"
          echo "SIGN_CONFIG=--config $(cygpath -m "$RUNNER_TEMP/sign.conf.json")" >> "$GITHUB_ENV"

      - run: npx tauri build --ci --target ${{ matrix.target }} --bundles nsis $SIGN_CONFIG
        env:
          CERTUM_EMAIL: ${{ env.SIGN_WINDOWS == 'true' && secrets.CERTUM_USERNAME || '' }}
          CERTUM_OTP: ${{ env.SIGN_WINDOWS == 'true' && secrets.CERTUM_TOTP_SECRET || '' }}

      # The bare executable runs without installing (WebView2 ships with Windows 10 and 11)
      - name: Collect the installer and the portable executable
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe dist/
          cp src-tauri/target/${{ matrix.target }}/release/bucketeer.exe "dist/Bucketeer_${VERSION}_${{ matrix.arch }}-portable.exe"
          ls -l dist

      - name: Verify Windows signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem dist/*.exe) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "== $($f.Name): $($sig.Status) ($($sig.SignerCertificate.Subject))"
            if ($sig.Status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: bucketeer-${{ matrix.target }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          # v1.2.3-rc.1 and similar are published as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
